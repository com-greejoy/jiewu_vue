# JasperReports 字体扩展注册
# 将 fonts.xml 中定义的字体族注册到 JasperReports 引擎，
# 使模板中使用的中文字体名（如"宋体"、"黑体"）能正确映射到内嵌的 .ttf 字体文件。
#
# 第一行：注册 SimpleFontExtensionsRegistryFactory 工厂，registry ID 为 "simple.font.families"
# 第二行：指定字体族定义文件路径（classpath 相对路径），属性前缀为 net.sf.jasperreports.extension.simple.font.families.<自定义ID>
net.sf.jasperreports.extension.registry.factory.simple.font.families=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.gyms=fonts/fonts.xml
